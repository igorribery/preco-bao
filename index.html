<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a45" />
    <title>Preço Bão | Ofertas boas direto no seu celular</title>

    <!-- Fundo azul já no primeiro frame (evita tela branca enquanto o JS carrega) -->
    <style>html,body{margin:0;background:#071a45}</style>

    <!-- Tela de carregamento: aparece instantaneamente e some quando o React assume -->
    <style>
      .pb-splash{min-height:100vh;color:#fff;font-family:'Trebuchet MS',system-ui,sans-serif;
        background:
          linear-gradient(rgba(42,93,176,.22) 1px,transparent 1px) 0 0/48px 48px,
          linear-gradient(90deg,rgba(42,93,176,.22) 1px,transparent 1px) 0 0/48px 48px,#071a45}
      .pb-bar{display:flex;align-items:center;gap:10px;padding:14px max(20px,calc((100% - 1080px)/2));
        border-bottom:1px solid rgba(42,93,176,.5);background:rgba(7,26,69,.92)}
      .pb-dot{width:44px;height:44px;border-radius:50%;background:#ff8a1f;animation:pb-pulse 1.2s ease-in-out infinite}
      .pb-brand{font-weight:800;font-size:1.4rem;color:#ff8a1f;animation:pb-pulse 1.2s ease-in-out infinite}
      .pb-brand b{color:#fff}
      .pb-wrap{width:min(1080px,100% - 40px);margin:0 auto;padding:56px 0;display:grid;
        grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
      .pb-col{display:flex;flex-direction:column;align-items:center;gap:16px}
      .pb-sk{position:relative;overflow:hidden;background:#0f2f73;border-radius:12px}
      .pb-sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
        animation:pb-shimmer 1.4s infinite}
      .pb-t1{width:92%;height:46px}.pb-t2{width:78%;height:46px}.pb-t3{width:60%;height:46px;margin-bottom:8px}
      .pb-p1{width:84%;height:16px}.pb-p2{width:64%;height:16px;margin-bottom:10px}
      .pb-btn{width:min(380px,100%);height:62px;border-radius:999px;background:#146b38}
      .pb-orb{width:min(380px,70vw);aspect-ratio:1;border-radius:50%;margin:0 auto;
        border:5px solid rgba(255,199,44,.55)}
      .pb-msg{grid-column:1/-1;text-align:center;color:#b9cdf0;font-size:.95rem;margin-top:8px}
      .pb-msg i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#ffc72c;
        animation:pb-bounce 1s infinite}
      .pb-msg i:nth-child(2){animation-delay:.15s}.pb-msg i:nth-child(3){animation-delay:.3s}
      @keyframes pb-shimmer{to{transform:translateX(100%)}}
      @keyframes pb-pulse{50%{opacity:.55}}
      @keyframes pb-bounce{40%{transform:translateY(-6px)}}
      @media (max-width:820px){
        .pb-wrap{grid-template-columns:1fr;padding:28px 0;gap:28px}
        .pb-t1,.pb-t2,.pb-t3{height:34px}
      }
      @media (prefers-reduced-motion:reduce){
        .pb-sk::after,.pb-dot,.pb-brand,.pb-msg i{animation:none}
      }
    </style>

    <!-- Fontes: conexão antecipada + carregamento sem travar a página -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap"

    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" />
    </noscript>

  <body>
        <div id="root">
      <div class="pb-splash" role="status" aria-label="Carregando o Preço Bão">
        <div class="pb-bar"><span class="pb-dot"></span><span class="pb-brand">Preço <b>Bão</b></span></div>
        <div class="pb-wrap">
          <div class="pb-col">
            <div class="pb-sk pb-t1"></div>
            <div class="pb-sk pb-t2"></div>
            <div class="pb-sk pb-t3"></div>
            <div class="pb-sk pb-p1"></div>
            <div class="pb-sk pb-p2"></div>
            <div class="pb-sk pb-btn"></div>
          </div>
          <div class="pb-sk pb-orb"></div>
          <div class="pb-msg"><i></i><i></i><i></i> Buscando as melhores ofertas</div>
        </div>
      </div>
    </div>
